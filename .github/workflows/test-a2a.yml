name: Test A2A

on:
  push:
    branches-ignore:
      - main
    paths:
      - "content/posts/a2a/repo/**"
  pull_request:
    paths:
      - "content/posts/a2a/repo/**"

defaults:
  run:
    working-directory: content/posts/a2a/repo

jobs:

  test-a2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest
