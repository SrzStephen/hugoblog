name: Verify OIDC Roles

on:
  push:
    branches: ["main"]
    paths:
      - "content/posts/oidc_aws_azure/**"
  pull_request:
    branches: ["main"]
    paths:
      - "content/posts/oidc_aws_azure/**"
  workflow_dispatch:

permissions:
  id-token: write  # required to mint the OIDC JWT
  contents: read

jobs:
  # ── AWS ───────────────────────────────────────────────────────────────────
  verify-aws:
    name: Verify AWS Role
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm assumed identity
        # Don't leak account id
        run: |
          aws sts get-caller-identity > /dev/null 
          echo "AWS OIDC role assumption: OK"

  # ── Azure ─────────────────────────────────────────────────────────────────
  verify-azure:
    name: Verify Azure Federated Identity
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_DEPLOYER }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm active account
        run: |
          az account show --output table > /dev/null
          echo "Azure federated identity login: OK"