[project]
name = "a2a"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]",
    "uvicorn",
    "httpx",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "wikipedia>=1.4.0",
    "langchain-openai>=1.1.9",
    "python-dotenv>=1.0.0",
    "rich>=14.3.2",
    "streamlit>=1.45.0",
    "loguru>=0.7.3",
    "msal>=1.31.0",
    "duckduckgo-search>=8.1.1",
    "pydantic-settings>=2.12.0",
    "ddgs>=9.10.0",
    "extra-streamlit-components>=0.1.81",
    "itsdangerous>=2.2.0",
    "pandas-stubs~=2.3.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agents", "client", "a2a_server", "util"]
module-root = "src"


[project.scripts]
a2a-client = "client.streamlit_app.streamlit_runner:main"
a2a-orchestrator = "client.orchestrator_agent.cli:main"
a2a-server = "a2a_server.base:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
